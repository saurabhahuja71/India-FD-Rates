name: Update FD rates and deploy Pages

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml pypdf
      - name: Run adapter fixture tests
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -v
      - name: Run FD rate updater
        run: python3 scripts/update_rates.py
      - name: Validate data
        run: python3 scripts/validate_data.py
      - name: Generate ranking audit and bank inventory
        run: python3 scripts/generate_reports.py
      - name: Check git diff and commit changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fd-rates.json data/fd-rates-history.json data/fetch_failures.json data/ranking_audit.json README.md all-banks.html
          git diff --cached --quiet || git commit -m "chore: update FD rates"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
